services:
  postgres:
    # The 20260517000000_add_pgvector migration runs CREATE EXTENSION vector.
    # postgres:17-alpine does not ship pgvector, so migrate deploy fails on it.
    image: pgvector/pgvector:pg17
    container_name: cultcodex-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cultcodex_v2
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
