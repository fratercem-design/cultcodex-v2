name: Run DB Migrations

on:
  workflow_dispatch:
    inputs:
      resolve_migration:
        description: >-
          Optional. Name of a FAILED migration to resolve before deploying,
          e.g. 20260423000000_add_saved_topics_quotes. Leave blank to just
          apply pending migrations. Read the "Diagnose" step output first.
        required: false
        default: ''
      resolve_as:
        description: >-
          How to resolve it. "rolled-back" = the migration left NOTHING behind
          and should be retried. "applied" = its changes ARE already in the
          database and it should be marked done. Picking wrong leaves the
          schema and the migration history disagreeing.
        required: false
        default: 'rolled-back'
        type: choice
        options:
          - rolled-back
          - applied

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # prisma.config.ts prefers DIRECT_URL for migrations. `prisma migrate
      # deploy` takes a pg advisory lock, which a pooled/PgBouncer endpoint can
      # silently drop or refuse — without this secret the CLI fell back to the
      # pooled DATABASE_URL and migrations could hang or fail to acquire the lock.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      # A failed migration row blocks every subsequent deploy with P3009, and
      # the error alone does not say whether the migration's changes actually
      # landed. This prints both halves of that question so the resolve choice
      # is made on evidence rather than a guess. Read-only.
      - name: Diagnose migration state
        run: |
          node -e '
            const { Client } = require("pg");
            const url = process.env.DIRECT_URL || process.env.DATABASE_URL;
            const c = new Client({ connectionString: url });
            (async () => {
              await c.connect();
              const failed = await c.query(
                `select migration_name, started_at, finished_at, rolled_back_at, applied_steps_count
                 from "_prisma_migrations"
                 where finished_at is null or rolled_back_at is not null
                 order by started_at desc`
              );
              if (!failed.rows.length) {
                console.log("No failed or unfinished migrations. Nothing to resolve.");
              } else {
                console.log("FAILED / UNFINISHED MIGRATIONS:");
                for (const r of failed.rows) {
                  console.log(
                    `  ${r.migration_name}  started=${r.started_at?.toISOString?.() ?? r.started_at}` +
                    `  steps_applied=${r.applied_steps_count}`
                  );
                }
              }
              const tables = await c.query(
                `select table_name from information_schema.tables
                 where table_schema = 'public' order by table_name`
              );
              const names = tables.rows.map((r) => r.table_name);
              console.log(`\nPUBLIC TABLES (${names.length}):`);
              console.log("  " + names.join(", "));
              console.log(
                "\nDecision rule: if the tables a failed migration was meant to create are" +
                "\nALREADY in that list, resolve it as `applied`. If none of them are there," +
                "\nresolve it as `rolled-back` so it runs again. If only SOME are there, the" +
                "\nmigration half-applied — do not resolve automatically, fix it by hand."
              );
              await c.end();
            })().catch((e) => { console.error("Diagnose failed:", e.message); process.exit(0); });
          '

      - name: Resolve failed migration
        if: ${{ github.event.inputs.resolve_migration != '' }}
        run: |
          echo "Resolving ${{ github.event.inputs.resolve_migration }} as ${{ github.event.inputs.resolve_as }}"
          npx prisma migrate resolve \
            --${{ github.event.inputs.resolve_as }} \
            "${{ github.event.inputs.resolve_migration }}"

      - name: Apply migrations
        run: |
          npx prisma migrate deploy 2>&1 | tee /tmp/migrate-output.txt
          SUMMARY=$(tail -5 /tmp/migrate-output.txt | tr '\n' ' ')
          echo "::notice title=Migrations::$SUMMARY"
