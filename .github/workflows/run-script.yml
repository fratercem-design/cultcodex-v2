name: Run DB Script

on:
  workflow_dispatch:
    inputs:
      script:
        # Allowlist. This job holds the production DATABASE_URL, so it runs only
        # scripts that have been reviewed into this list; add one via a PR.
        description: 'Script under scripts/ to run'
        required: true
        type: choice
        options:
          - validate-data.ts
          - _db-stats.ts
          - _drift-check.ts
          - _diagnose-migrations.ts
          - _psychenomicon-slop-audit.ts
          - ops/test-gemini.mjs
          - ops/test-providers.mjs
          - ops/placeholder-episodes.ts
          - ops/placeholder-episodes-apply.ts
          - ops/rumble-transcripts.ts
          - ops/rumble-transcripts-apply.ts
          - ops/enrich-rumble-drafts.ts
          - ops/enrich-rumble-drafts-apply.ts
          - ops/people-dedupe.ts
          - ops/people-dedupe-apply.ts
          - ops/rumble-embed-ids.ts
          - ops/rumble-embed-ids-apply.ts

permissions:
  contents: read

jobs:
  run:
    name: Run script
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run script
        env:
          # Keep the Gemini key scoped to the dedicated smoke test rather than
          # exposing it to every script this generic workflow can execute.
          GEMINI_API_KEY: ${{ github.event.inputs.script == 'ops/test-gemini.mjs' && secrets.GEMINI_API_KEY || '' }}
          # Passed through env, never interpolated into the shell source.
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          set -o pipefail
          # Belt and braces: the choice input is enforced by GitHub for UI
          # dispatches, but re-check here for API dispatches.
          case "$SCRIPT" in
            validate-data.ts|_db-stats.ts|_drift-check.ts|_diagnose-migrations.ts|_psychenomicon-slop-audit.ts|ops/test-gemini.mjs|ops/test-providers.mjs|ops/placeholder-episodes.ts|ops/placeholder-episodes-apply.ts|ops/rumble-transcripts.ts|ops/rumble-transcripts-apply.ts|ops/enrich-rumble-drafts.ts|ops/enrich-rumble-drafts-apply.ts|ops/people-dedupe.ts|ops/people-dedupe-apply.ts|ops/rumble-embed-ids.ts|ops/rumble-embed-ids-apply.ts) ;;
            *) echo "::error::scripts/$SCRIPT is not on the allowlist"; exit 1 ;;
          esac
          echo "── Running scripts/$SCRIPT ──"
          npx tsx "scripts/$SCRIPT" | tee /tmp/script-output.txt
          SUMMARY=$(tail -5 /tmp/script-output.txt | tr '\n' ' ')
          echo "::notice title=Script output::$SUMMARY"
