name: Backfill Segment Embeddings

# Fills TranscriptSegment.embedding by running scripts/embed-segments.ts on the
# runner, connected straight to the database. It used to call
# POST /api/admin/embed in a loop, but that shared the site's connection pool
# and kept failing with "timeout exceeded when trying to connect".
#
# Each batch embeds the next NULL rows by id, so a run can stop at any point and
# the next run carries on. The full backfill is ~4.86M rows, longer than one
# 6-hour job: re-run until a run ends with "Backfill complete". Start with a
# small max_segments to check one run end to end.
#
# Needs repository secrets: DATABASE_URL and OPENAI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Segments per batch (max 500)
        required: true
        default: '500'
      max_segments:
        description: Stop after about this many segments (0 = no limit)
        required: true
        default: '0'
      max_minutes:
        description: Stop starting new batches after this many minutes
        required: true
        default: '330'
      pause_ms:
        description: Pause between batches, to keep write load on the database down
        required: true
        default: '250'

permissions:
  contents: read

# Two runs would embed the same NULL rows twice and pay for both.
concurrency:
  group: embed-segments
  cancel-in-progress: false

jobs:
  backfill:
    name: Embed transcript segments
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::OPENAI_API_KEY secret is not set (Settings → Secrets and variables → Actions)"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BATCH: ${{ inputs.batch }}
          MAX_SEGMENTS: ${{ inputs.max_segments }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          PAUSE_MS: ${{ inputs.pause_ms }}
        run: npx tsx scripts/embed-segments.ts
