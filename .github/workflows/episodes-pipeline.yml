name: CultofPsyche Transcript Import

on:
  # Nothing was fetching transcripts automatically. The daily Vercel cron
  # (/api/cron/ingest-latest, 15:00 UTC) creates Episode rows from YouTube
  # metadata but touches no transcripts, and this workflow was dispatch-only —
  # so every new episode sat transcript-less, and therefore un-enriched and
  # without a real meta description, until someone triggered this by hand.
  #
  # Runs 90 minutes after that ingest so the new rows exist. On a schedule run
  # github.event.inputs is null, so the `|| default` fallbacks in the run step
  # apply: content type "original", all missing transcripts, 1500ms apart. The
  # script fetches the missing list first and exits early when there is none.
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to import'
        required: false
        default: 'original'
        type: choice
        options:
          - original
          - short
          - clip
      max_transcripts:
        description: 'Max transcripts to fetch (0 = all)'
        required: false
        default: '0'
      delay_ms:
        description: 'Delay between transcript fetches (ms)'
        required: false
        default: '1500'

jobs:
  import:
    name: Import via Vercel endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install yt-dlp
        run: pip install -q yt-dlp

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt-cookies.txt
            # yt-dlp rejects a non-Netscape jar before fetching anything, so one
            # malformed secret failed every transcript, public videos included
            # (same guard as asr-pipeline.yml). Discard it and fetch without.
            if ! head -n 1 /tmp/yt-cookies.txt | grep -qE '^# (Netscape )?HTTP Cookie File'; then
              echo "::warning title=Bad cookies::YOUTUBE_COOKIES is not Netscape format - discarding. Public videos will still fetch; age-restricted and members-only ones will fail."
              rm -f /tmp/yt-cookies.txt
            else
              # Names only, never values: shows whether the jar actually carries
              # a signed-in YouTube session (a logged-out export still passes
              # the header check but gets "Sign in to confirm you're not a bot").
              echo "Cookies written: $(grep -cv '^#[^H]' /tmp/yt-cookies.txt) entries."
              for n in LOGIN_INFO SID __Secure-1PSID __Secure-3PSID SAPISID; do
                if awk -F'\t' -v n="$n" '$6 == n { f = 1 } END { exit !f }' /tmp/yt-cookies.txt; then
                  echo "  $n: present"
                else
                  echo "  $n: MISSING"
                fi
              done
            fi
          else
            echo "No YOUTUBE_COOKIES secret — transcript fetch will likely fail."
          fi

      - name: Import transcripts
        env:
          ENRICH_SECRET: ${{ secrets.ENRICH_SECRET }}
          VERCEL_URL: https://cultcodex.me
          YOUTUBE_COOKIES_FILE: /tmp/yt-cookies.txt
        run: |
          npx tsx scripts/import-episodes-ytdlp.ts \
            --content-type "${{ github.event.inputs.content_type || 'original' }}" \
            --delay "${{ github.event.inputs.delay_ms || '1500' }}" \
            --max "${{ github.event.inputs.max_transcripts || '0' }}" \
            | tee /tmp/import-output.txt
          echo "## Transcript Import Summary" >> $GITHUB_STEP_SUMMARY
          grep -E "Total episodes:|Have transcripts:|Missing:|Done —|Nothing to do" /tmp/import-output.txt >> $GITHUB_STEP_SUMMARY || true
          # emit counts as annotations so they're readable via API
          SUMMARY=$(grep -E "Total episodes:|Have transcripts:|Missing:|Done —|Nothing to do" /tmp/import-output.txt | tr '\n' ' ')
          echo "::notice title=Transcript counts::$SUMMARY"
