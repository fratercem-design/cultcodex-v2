name: Grok Bot

on:
  pull_request:
    paths: ["grok-bot/**", ".github/workflows/grok-bot.yml"]
  push:
    branches: [master]
    paths: ["grok-bot/**", ".github/workflows/grok-bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grok-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grok-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
