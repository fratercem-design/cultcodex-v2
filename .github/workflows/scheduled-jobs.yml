name: Scheduled production jobs

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: ingest-latest
        type: choice
        options:
          - ingest-latest
          - gift-sequence

permissions:
  contents: read

concurrency:
  group: cultcodex-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  ingest-latest:
    if: github.event.schedule == '0 15 * * *' || inputs.job == 'ingest-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ingest latest uploads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://cultcodex.me' }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/ingest-latest"

  gift-sequence:
    if: github.event.schedule == '0 17 * * *' || inputs.job == 'gift-sequence'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Advance gift email sequence
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://cultcodex.me' }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/gift-sequence"
