name: Enrich CultofPsyche Episodes

on:
  # Ingest (15:00 UTC) and transcript import (16:30 UTC) are scheduled, but this
  # workflow was dispatch-only. It last ran 2026-09-24, so every episode since
  # then got a transcript and no summary: on 2026-11-12, 47 of the 50 newest
  # episode pages still carried the generic "Watch <title> from Cult of
  # Psyche" fallback description.
  #
  # Runs after the transcript import. GitHub delays scheduled runs by hours
  # under load, so the order is not guaranteed; an episode whose transcript
  # lands late is picked up by the next day's run. On a schedule run
  # github.event.inputs is null, so the `|| default` fallbacks apply: 50
  # episodes on the free OpenRouter model.
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: 'Episodes to enrich per run'
        required: false
        default: '50'
      provider:
        description: 'LLM provider (openrouter = free, anthropic = paid Haiku)'
        type: choice
        options:
          - openrouter
          - anthropic
        default: openrouter

# Two overlapping runs select the same un-enriched episodes and pay for each twice.
concurrency:
  group: enrich-episodes
  cancel-in-progress: false

jobs:
  enrich:
    name: AI enrichment via Claude
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Provider is chosen per-run. The openrouter model is free with a 1M
      # context window, which matters because buildTranscriptText() does not
      # truncate - a multi-hour transcript is an enormous prompt. anthropic
      # uses Haiku and bills the account.
      ENRICHMENT_PROVIDER: ${{ inputs.provider || 'openrouter' }}
      ENRICHMENT_MODEL: ${{ (inputs.provider == 'anthropic') && 'claude-haiku-4-5-20251001' || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enrich episodes
        run: |
          # Without pipefail, tee's exit code masks the script's, so a crashed
          # or fully-failed batch still showed as a green run.
          set -o pipefail
          BATCH="${{ github.event.inputs.batch || '50' }}"
          echo "── Enriching up to $BATCH episodes ──"
          npx tsx scripts/enrich/enrich-episodes.ts --batch "$BATCH" | tee /tmp/enrich-output.txt
          echo ""
          echo "── Importing enriched data to DB ──"
          npx tsx scripts/enrich/import-enriched.ts | tee /tmp/import-output.txt
          SUMMARY=$(grep -E "Found [0-9]+ original|candidates with|Done —|Imported|Nothing" /tmp/enrich-output.txt /tmp/import-output.txt 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Enrichment results::$SUMMARY"
