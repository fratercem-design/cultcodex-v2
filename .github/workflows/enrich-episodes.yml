name: Enrich CultofPsyche Episodes

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Episodes to enrich per run'
        required: false
        default: '50'

jobs:
  enrich:
    name: AI enrichment via Claude
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # The Anthropic account has no credits ("credit balance is too low"), so
      # enrich via OpenRouter's free tier instead. minimax-m3 is chosen for its
      # 1M context: buildTranscriptText() does not truncate, and a 7h episode
      # transcript is an enormous prompt.
      ENRICHMENT_MODEL: minimax/minimax-m3:free
      # scripts/enrich/lib.ts defaults to the bedrock provider, which needs AWS
      # credentials this repo does not have - every episode failed with
      # 'Failed to resolve AWS credentials'. Use the Anthropic API directly,
      # via the ANTHROPIC_API_KEY already passed above.
      ENRICHMENT_PROVIDER: openrouter

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enrich episodes
        run: |
          BATCH="${{ github.event.inputs.batch || '50' }}"
          echo "── Enriching up to $BATCH episodes ──"
          npx tsx scripts/enrich/enrich-episodes.ts --batch "$BATCH" | tee /tmp/enrich-output.txt
          echo ""
          echo "── Importing enriched data to DB ──"
          npx tsx scripts/enrich/import-enriched.ts | tee /tmp/import-output.txt
          SUMMARY=$(grep -E "Found [0-9]+ original|candidates with|Done —|Imported|Nothing" /tmp/enrich-output.txt /tmp/import-output.txt 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Enrichment results::$SUMMARY"
