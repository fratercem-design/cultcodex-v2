name: keep-alive

# Pings /api/keep-alive so the Xata Postgres branch never hibernates from
# inactivity. A sleeping branch fails production builds ("branch is hibernated,
# reactivate it to continue") because the build prerenders thousands of static
# pages against the DB. Vercel Hobby crons only run daily — too infrequent — so
# the warm-keeping lives here on GitHub Actions at the 5-minute floor instead.
#
# Note: GitHub often delays scheduled runs by several minutes under load, so the
# effective interval can drift to ~10-20 min. If the branch still hibernates,
# the durable fix is disabling hibernation on the Xata side.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Never let overlapping runs pile up.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping keep-alive endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://cultcodex.me/api/keep-alive")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "keep-alive did not return 200 after retries (branch may have been mid-reactivation)"
          # Do not fail the workflow — a transient miss is fine; the next tick retries.
          exit 0
