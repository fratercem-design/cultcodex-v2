name: PsychesNightmares Import Pipeline

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - episodes
          - transcripts
      max_transcripts:
        description: 'Max transcripts to fetch (0 = all)'
        required: false
        default: '0'
      delay_ms:
        description: 'Delay between transcript fetches (ms)'
        required: false
        default: '2000'

jobs:
  import:
    name: Import via Vercel endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run import pipeline
        env:
          ENRICH_SECRET: ${{ secrets.ENRICH_SECRET }}
          VERCEL_URL: https://cultcodex.me
        run: |
          npx tsx scripts/import-nightmares.ts \
            --step "${{ github.event.inputs.step || 'all' }}" \
            --delay "${{ github.event.inputs.delay_ms || '2000' }}" \
            --max "${{ github.event.inputs.max_transcripts || '0' }}"
