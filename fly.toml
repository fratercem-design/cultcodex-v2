# Set the Fly app name and primary region during `fly launch --no-deploy`.
# Choose a region close to the current Xata production database.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DEPLOY_ENV = "production"
  NEXT_PUBLIC_DEPLOY_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://cultcodex.me"
  NEXTAUTH_URL = "https://cultcodex.me"
  AUTH_TRUST_HOST = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 75
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[[restart]]
  policy = "on-failure"
  retries = 5
  processes = ["app"]
