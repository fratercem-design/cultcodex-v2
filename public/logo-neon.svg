<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Cult of Psyche">
  <title>Cult of Psyche</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="0.55" stop-color="#0b0614"/>
      <stop offset="1" stop-color="#030208"/>
    </radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <!-- 4-point sparkle, centred on 0,0 -->
    <path id="sparkle" d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z"/>

    <!-- Seal ring + stars -->
    <g id="ring">
      <circle cx="512" cy="500" r="238"/>
      <circle cx="512" cy="500" r="222" stroke-width="3"/>
      <use xlink:href="#sparkle" transform="translate(512 238) scale(1.3)"/>
      <use xlink:href="#sparkle" transform="translate(262 500)"/>
      <use xlink:href="#sparkle" transform="translate(762 500)"/>
      <use xlink:href="#sparkle" transform="translate(512 318) scale(0.8)"/>
    </g>

    <!-- Open book -->
    <g id="book">
      <!-- inner pages -->
      <path d="M512 402 C470 370 420 366 378 370 L378 648 C428 644 478 652 512 676"/>
      <path d="M512 402 C554 370 604 366 646 370 L646 648 C596 644 546 652 512 676"/>
      <!-- covers -->
      <path d="M512 390 C466 352 404 348 352 354 L352 668 C420 664 476 672 504 692"/>
      <path d="M512 390 C558 352 620 348 672 354 L672 668 C604 664 548 672 520 692"/>
      <!-- page stacks -->
      <path d="M352 380 L336 382 L336 684 C410 680 470 688 498 708"/>
      <path d="M672 380 L688 382 L688 684 C614 680 554 688 526 708"/>
      <!-- page flourishes -->
      <path d="M398 404 C436 398 474 408 498 430" stroke-width="3"/>
      <path d="M626 404 C588 398 550 408 526 430" stroke-width="3"/>
      <!-- spine -->
      <path d="M512 402 L512 440"/>
      <path d="M512 552 L512 650"/>
    </g>

    <!-- Eye + rays -->
    <g id="eye">
      <path d="M420 496 Q512 422 604 496 Q512 570 420 496 Z"/>
      <circle cx="512" cy="496" r="34"/>
      <circle cx="512" cy="496" r="14"/>
      <path d="M492 470 Q512 486 532 470" stroke-width="3"/>
      <g stroke-width="3">
        <path d="M512 428 L512 412"/>
        <path d="M466 440 L456 426"/>
        <path d="M558 440 L568 426"/>
        <path d="M432 466 L416 458"/>
        <path d="M592 466 L608 458"/>
        <path d="M432 526 L416 534"/>
        <path d="M592 526 L608 534"/>
        <path d="M466 552 L456 566"/>
        <path d="M558 552 L568 566"/>
      </g>
    </g>

    <!-- Keyhole -->
    <g id="keyhole">
      <circle cx="512" cy="680" r="18"/>
      <path d="M503 696 L490 758 L534 758 L521 696"/>
    </g>

    <!-- Wordmark -->
    <text id="word" x="512" y="872" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Cormorant Garamond', Georgia, serif" font-size="68" font-weight="600" letter-spacing="10">CULT OF PSYCHE</text>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="220" fill="#7a1fff" opacity="0.18" filter="url(#haze)"/>

  <!-- coloured glow tubes -->
  <g filter="url(#neon)" stroke-width="6">
    <use xlink:href="#ring" stroke="#ff2bd6"/>
    <use xlink:href="#book" stroke="#19e6ff"/>
    <use xlink:href="#eye" stroke="#ffb300"/>
    <use xlink:href="#keyhole" stroke="#ff2bd6"/>
    <use xlink:href="#word" fill="none" stroke="#19e6ff" stroke-width="4"/>
  </g>

  <!-- white-hot cores -->
  <g stroke-width="2">
    <use xlink:href="#ring" stroke="#ffd9f6"/>
    <use xlink:href="#book" stroke="#d9fbff"/>
    <use xlink:href="#eye" stroke="#fff1c9"/>
    <use xlink:href="#keyhole" stroke="#ffd9f6"/>
    <use xlink:href="#word" fill="none" stroke="#e6fdff" stroke-width="1.5"/>
  </g>
  <circle cx="512" cy="496" r="6" fill="#fff6dc" filter="url(#neon)"/>
</svg>
